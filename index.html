<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linguahe AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1e1e1e;
            --container-bg: #2d2d2d;
            --text-primary: #ededed;
            --text-secondary: #9ca3af;
            --border-color: #3f3f46;
            --accent-color: #d97757; 
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 80px 20px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            margin-top: 96px;
            animation: fadeIn 0.6s ease;
        }

        .logo-icon {
            color: var(--accent-color);
            font-size: 34px;
            margin-bottom: 12px;
            display: inline-block;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #f9f9f9;
        }

        .input-wrapper {
            width: 100%;
            max-width: 680px;
            background: var(--container-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .input-wrapper:focus-within {
            border-color: #52525b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 16px 20px;
            font-size: 15.5px;
            resize: none;
            outline: none;
            min-height: 100px;
            line-height: 1.5;
        }
        
        textarea::placeholder {
            color: #71717a;
        }

        .action-bar {
            padding: 8px 16px 12px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .send-btn {
            background-color: #ededed;
            color: #1e1e1e;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover { background-color: #ffffff; }

        .send-btn:disabled {
            background-color: #3f3f46;
            color: #a1a1aa;
            cursor: not-allowed;
        }

        .result-container {
            width: 100%;
            max-width: 680px;
            margin-top: 32px;
            display: none;
        }

        .result-card {
            background: var(--container-bg);
            border-radius: 12px;
            padding: 24px 32px;
            border: 1px solid var(--border-color);
            animation: slideUp 0.3s ease;
        }

        .result-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .predicted-lang {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .status-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .status-confident { background: rgba(16, 185, 129, 0.1); color: var(--success-color); }
        .status-uncertain { background: rgba(245, 158, 11, 0.1); color: var(--warning-color); }

        .confidence-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .confidence-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .conf-label {
            width: 100px;
            font-size: 14.5px;
            color: var(--text-primary);
            font-weight: 400;
        }

        .conf-bar-bg {
            flex: 1;
            height: 6px;
            background: #404040;
            border-radius: 3px;
            overflow: hidden;
        }

        .conf-bar-fill {
            height: 100%;
            background: #737373;
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .primary-fill { background: var(--accent-color); }

        .conf-val {
            width: 45px;
            text-align: right;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .error-msg {
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>
    <div class="header">
        <div style="display: inline-flex; flex-direction: row; align-items: center; gap: 8px;">
        <div class="logo-icon">✹</div>
        <h1>Linguahe AI</h1>
        </div>
    </div>

    <div class="input-wrapper">
        <textarea id="text-input" placeholder="How can I help you today? Type some text here..." autofocus oninput="autoResize(this)"></textarea>
        <div class="action-bar">
            <button id="predict-btn" class="send-btn" onclick="predictLanguage()">
                Analyze
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <div id="result-container" class="result-container"></div>

    <script>
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        async function predictLanguage() {
            const textInput = document.getElementById('text-input');
            const predictBtn = document.getElementById('predict-btn');
            const resultDiv = document.getElementById('result-container');
            const text = textInput.value.trim();
            
            if (!text) return;

            predictBtn.disabled = true;
            predictBtn.innerHTML = 'Analyzing...';
            resultDiv.style.display = 'none';

            try {
                const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:8001'
                    : window.location.origin;
                const response = await fetch(`${API_BASE}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error(`Server responded with ` + response.status);
                const data = await response.json();

                const displayLanguage = data.language === 'uncertain' ? 'Uncertain' : data.language.charAt(0).toUpperCase() + data.language.slice(1);
                const badgeClass = data.is_confident ? 'status-confident' : 'status-uncertain';
                const badgeText = data.is_confident ? 'Confident' : 'Uncertain';

                let confHTML = '';
                let index = 0;
                
                Object.entries(data.confidence)
                    .sort(([,a], [,b]) => b - a)
                    .forEach(([lang, conf]) => {
                        const percentage = (conf * 100).toFixed(1);
                        const isPrimary = index === 0;
                        confHTML += `
                            <div class="confidence-item">
                                <span class="conf-label">${lang.charAt(0).toUpperCase() + lang.slice(1)}</span>
                                <div class="conf-bar-bg">
                                    <div class="conf-bar-fill ${isPrimary ? 'primary-fill' : ''}" style="width: ${percentage}%"></div>
                                </div>
                                <span class="conf-val">${percentage}%</span>
                            </div>
                        `;
                        index++;
                    });

                resultDiv.innerHTML = `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="predicted-lang">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color)">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                                ${displayLanguage}
                            </div>
                            <span class="status-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="confidence-list">
                            ${confHTML}
                        </div>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result-card">
                        <div class="error-msg">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            ${error.message}. Is the API running?
                        </div>
                    </div>
                `;
            } finally {
                resultDiv.style.display = 'block';
                predictBtn.disabled = false;
                predictBtn.innerHTML = `
                    Analyze
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                `;
            }
        }

        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                predictLanguage();
            }
        });
    </script>
</body>
</html>
